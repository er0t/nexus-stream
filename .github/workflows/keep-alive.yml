name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint
        run: |
          echo "Pinging Render backend health check at $(date -u)..."
          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "Attempt $i: probing https://nexus-backend-71wf.onrender.com/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://nexus-backend-71wf.onrender.com/health || true)
            echo "Attempt $i responded with HTTP Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Render backend is awake and healthy."
              SUCCESS=1
              break
            fi
            echo "Render container is spinning up. Waiting 10s before retry..."
            sleep 10
          done

          if [ "$SUCCESS" = "1" ]; then
            echo "Health check succeeded."
          else
            echo "Notice: Render container took longer to wake up. Health check ping completed."
          fi
          exit 0
