services:
  - type: web
    name: nexus-stream-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 5 --limit-concurrency 100
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
